schema: spec-driven

context: |
  Afallon is a screenshot-first interactive atlas and eventual compendium.
  In-game captures are the primary basemap. Illustrated maps are optional.
  Use deck.gl with an orthographic view for the SvelteKit map.
  Full reachable content coverage and linked game facts are required.
  Read EXPLORATION.md for measured evidence and its limitations.
  Game binaries, recovered code, saves, raw snapshots, and images stay outside Git.
  Prefer concrete game-specific modules over a reusable multi-game framework.
